<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacetGraph-QA Dataset & Prompt Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- Toast notification container -->
    <div id="toast-container" class="toast-container"></div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
    </div>

    <!-- Top Navigation Header -->
    <header class="app-header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>FacetGraph-QA Studio</span>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" id="tab-dataset" onclick="switchTab('dataset')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
                数据集分析 (Dataset)
            </button>
            <button class="tab-btn" id="tab-prompt" onclick="switchTab('prompt')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.5 1z"></path></svg>
                提示词控制台 (Prompt Hub)
            </button>
        </nav>
    </header>

    <!-- TAB 1: DATASET EXPLORER VIEW -->
    <div class="app-layout active" id="layout-dataset">
        <aside class="sidebar">
            <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                对话轮次
            </h2>
            <div id="round-list" class="round-list">
                <!-- Round items injected here -->
            </div>
        </aside>

        <main class="main-content">
            <div class="ambient-glow"></div>
            <div id="content-wrapper" class="content-wrapper" style="display: none;">
                
                <div class="question-header">
                    <div class="question-label">当前轮次问题 (Question)</div>
                    <div id="question-text" class="question-text">
                        <!-- Q text injected here -->
                    </div>
                </div>

                <div class="section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    切面视角生成结果 (Parallel Facet QA Agents)
                </div>
                
                <div id="facets-grid" class="facets-grid">
                    <!-- Facet cards injected here -->
                </div>

                <div class="section-title" style="margin-top: 40px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    本轮综合总结 (Synthesis Summary)
                </div>

                <div class="summary-panel markdown-body" id="summary-content">
                    <!-- Summary injected here -->
                </div>

            </div>
        </main>
    </div>

    <!-- TAB 2: PROMPT MANAGER VIEW -->
    <div class="app-layout" id="layout-prompt">
        <aside class="sidebar">
            <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                提示词模板
            </h2>
            <div id="prompt-list" class="round-list">
                <!-- Prompt items injected here -->
            </div>
        </aside>

        <main class="main-content flex-row">
            <!-- Left panel: Editor workspace -->
            <section class="prompt-workspace-panel">
                <div class="question-header">
                    <div class="question-label" id="current-prompt-label">当前选中的模版</div>
                    <div id="current-prompt-title" class="question-text">
                        FACET_PLANNER_TEMPLATE
                    </div>
                </div>

                <div class="editor-container">
                    <div class="editor-header">
                        <span>在线编辑模板内容</span>
                        <span class="version-badge" id="active-version-badge">Version 1</span>
                    </div>
                    <textarea id="prompt-editor" class="prompt-editor" placeholder="在此编辑提示词模版..."></textarea>
                </div>

                <div class="editor-footer-form">
                    <input type="text" id="update-description" class="update-description-input" placeholder="输入本次修改的更新说明（如：重构医学切面示例，剔除商业示例）...">
                    <button class="save-btn" onclick="savePromptUpdate()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        保存并激活新版本 (Submit)
                    </button>
                </div>
            </section>

            <!-- Right panel: Time travel versions -->
            <section class="prompt-history-panel">
                <h3>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    版本时光机
                </h3>
                <div id="version-timeline" class="version-timeline">
                    <!-- Timeline items injected here -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
